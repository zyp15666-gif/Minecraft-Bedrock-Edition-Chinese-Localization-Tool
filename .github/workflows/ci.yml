name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip install -r requirements.txt

    - name: Run pip-audit
      run: pip-audit --format=json --output=audit.json || true

    - name: Upload pip-audit results
      uses: github/upload-security-artifacts@v1
      if: always()
      with:
        name: pip-audit-results
        path: audit.json
        retention-days: 30

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov mypy
        pip install -r requirements.txt

    - name: Run type checking
      run: |
        mypy --ignore-missing-imports .

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short --cov=core --cov=api --cov=config --cov=ui --cov-report=term-missing --cov-report=xml

    - name: Upload coverage report
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Generate PyInstaller spec if missing
      run: |
        if (-not (Test-Path "MinecraftBedrockLocalizer.spec")) {
          python -c "
          import PyInstaller.building.build_main as bm
          from PyInstaller.utils.hooks import collect_data_files
          datas = collect_data_files('flet')
          a = bm.Analyze(
              ['scripts/run_flet_desktop.py'],
              datas=datas,
              hiddenimports=['flet', 'flet_core', 'flet_runtime'],
              name='MinecraftBedrockLocalizer',
          )
          "
          pyinstaller --name MinecraftBedrockLocalizer --windowed --noconfirm scripts/run_flet_desktop.py
        } else {
          pyinstaller MinecraftBedrockLocalizer.spec --noconfirm
        }

    - name: Upload PyInstaller artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftBedrockLocalizer-portable
        path: dist/MinecraftBedrockLocalizer/
        retention-days: 30

  build-installer:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyyaml
        pip install -r requirements.txt

    - name: Install NSIS
      run: choco install nsis -y

    - name: Build installer
      run: python scripts/build_installer.py --full

    - name: Find installer
      id: find_installer
      run: |
        $installer = Get-ChildItem -Path dist -Filter "*.exe" -Recurse | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
        if ($installer) {
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
        } else {
          echo "No installer found"
          exit 1
        }

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find_installer.outputs.installer_name }}
        path: ${{ steps.find_installer.outputs.installer_path }}
        retention-days: 90

  release:
    needs: build-installer
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download installer
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get version
      id: version
      run: |
        if [ -f "pyproject.toml" ]; then
          VERSION=$(python3 -c "
        import re
        with open('pyproject.toml') as f:
            for line in f:
                m = re.match(r'^version\s*=\s*[\"']([^\"']+)[\"']', line)
                if m:
                    print(m.group(1))
                    break
        ")
        else
          VERSION="1.0.0"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
