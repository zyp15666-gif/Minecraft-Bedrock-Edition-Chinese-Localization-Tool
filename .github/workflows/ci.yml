name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest with coverage
        run: pytest tests --cov=. --cov-report=xml --cov-report=term-missing -q

      - name: Coverage gate - api package
        run: pytest tests --cov=api --cov-report=term-missing -q --cov-fail-under=60

      - name: Coverage gate - core/use_cases
        run: pytest tests --cov=core.use_cases --cov-report=term-missing -q --cov-fail-under=55

  build-and-sign:
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Build with PyInstaller
        run: python scripts/build_installer.py --full

      - name: Sign executable
        if: env.SIGNING_CERT_BASE64 != ''
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:TEMP "signing_cert.pfx"
          [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64) | Set-Content $certPath -AsByteStream
          $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
            & signtool.exe sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exePath.FullName
            Write-Host "Signed: $($exePath.FullName)"
          }
          Remove-Item $certPath -Force

      - name: Generate SHA256 checksum
        run: |
          $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
            $hash = (Get-FileHash $exePath.FullName -Algorithm SHA256).Hash
            "$hash  $($exePath.Name)" | Out-File -FilePath "dist\SHA256.txt" -Encoding utf8
            Write-Host "SHA256: $hash"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/SHA256.txt
          retention-days: 30

  release:
    needs: build-and-sign
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Generate changelog
        id: changelog
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($prevTag) {
            $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
            $log = git log --pretty=format:"- %s (%h)" --no-merges -20
          }
          $log | Out-File -FilePath "CHANGELOG_RELEASE.txt" -Encoding utf8
          Write-Host "Changelog generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256.txt
          body_path: CHANGELOG_RELEASE.txt
          draft: false
          prerelease: false
