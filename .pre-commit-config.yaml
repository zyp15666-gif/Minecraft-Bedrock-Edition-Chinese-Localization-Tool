# 预提交钩子配置
# 安装: pip install pre-commit
# 初始化: pre-commit install
# 运行所有文件: pre-commit run --all-files
# 手动触发: pre-commit run

repos:
  # 通用代码质量检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # 移除尾随空格
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # 检查文件是否以换行符结尾
      - id: end-of-file-fixer
        exclude: ^(tests/|data/|resources/)
      # 检查合并冲突标记
      - id: check-merge-conflict
      # 检查YAML文件语法
      - id: check-yaml
        exclude: ^(\.github/workflows/)
      # 检测已添加但可能较大的文件
      - id: check-added-large-files
        args: ['--maxkb=10240']
      # 检查JSON文件语法
      - id: check-json
      # 检查TOML文件语法
      - id: check-toml
      # 检查XML文件语法
      - id: check-xml
        files: \.(xml|ui|qrc)$

  # Python代码格式化
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: [--line-length=120]
        exclude: ^(tests/data/|resources/)

  # Ruff 快速检查（替代部分 flake8/isort 功能）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(tests/data/|resources/)

  # Python导入排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=120"]
        exclude: ^(tests/data/|resources/)

  # Python代码风格检查
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203,E501,W503]
        exclude: ^(tests/data/|resources/|ui/main_window_flet_backup.py)
        additional_dependencies:
          - flake8-docstrings
          - flake8-comprehensions
          - flake8-bugbear

  # Python静态类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --follow-imports=skip]
        exclude: ^(tests/|data/|resources/)
        additional_dependencies:
          - types-PyYAML
          - types-requests

  # Python安全漏洞检查
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^(tests/|data/|resources/)

  # 测试文件检查
  - repo: https://github.com/pre-commit/mirrors-pytest
    rev: v8.2.1
    hooks:
      - id: pytest
        args: [--tb=short, -v]
        exclude: ^(data/|resources/)
        additional_dependencies:
          - pytest-cov
          - pytest-mock

  # 配置文件检查
  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: v3.2.3
    hooks:
      - id: pylint
        args: [--rcfile=.pylintrc]
        exclude: ^(tests/|data/|resources/|ui/main_window_flet_backup.py)

  # 提交消息检查
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.11.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        args: ['--config', '.commitlintrc.json']

  # 禁止直接提交到主分支
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # 检查 Flet 弃用 API（本地钩子）
  - repo: local
    hooks:
      - id: check-flet-deprecated
        name: 检查 Flet 弃用 API
        entry: python scripts/check_flet_deprecated.py
        language: python
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true

# 全局排除文件
exclude: |
  (?x)^(
    # 版本控制文件
    \.git/|
    \.venv/|
    venv/|
    __pycache__/|
    \.pytest_cache/|
    \.coverage|
    coverage\.xml|
    
    # 构建输出
    dist/|
    build/|
    \.eggs/|
    \*.egg-info/|
    
    # 数据文件
    data/.*|
    resources/.*|
    
    # 日志文件
    \*.log|
    logs/.*|
    
    # 备份文件
    \*_backup\.py|
    \*\.bak|
    
    # 二进制文件
    \*.exe|
    \*.dll|
    \*.so|
    \*.pyd|
    
    # 其他
    \.DS_Store|
    \.vscode/|
    \.idea/
  )

# 配置钩子运行顺序
default_stages: [commit, push]
fail_fast: false
minimum_pre_commit_version: "2.20.0"