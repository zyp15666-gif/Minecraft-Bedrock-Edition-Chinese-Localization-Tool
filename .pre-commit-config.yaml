# 预提交钩子配置
# 安装: pip install pre-commit
# 初始化: pre-commit install
# 运行所有文件: pre-commit run --all-files
# 手动触发: pre-commit run

repos:
  # 通用代码质量检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^(tests/|data/|resources/)
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^(\.github/workflows/)
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-json
      - id: check-toml
      - id: check-xml
        files: \.(xml|ui|qrc)$

  # Ruff 快速检查 + 格式化（替代 black/isort/flake8）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(tests/data/|resources/)
      - id: ruff-format
        exclude: ^(tests/data/|resources/)

  # Python静态类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --follow-imports=skip]
        exclude: ^(tests/|data/|resources/)
        additional_dependencies:
          - types-PyYAML
          - types-requests

  # Python安全漏洞检查
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^(tests/|data/|resources/)

  # 提交消息检查
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.11.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        args: ['--config', '.commitlintrc.json']

  # 禁止直接提交到主分支
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # 检查 Flet 弃用 API（本地钩子）
  - repo: local
    hooks:
      - id: check-flet-deprecated
        name: 检查 Flet 弃用 API
        entry: python scripts/check_flet_deprecated.py
        language: python
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true

exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv/|
    __pycache__/|
    \.pytest_cache/|
    \.coverage|
    coverage\.xml|
    dist/|
    build/|
    \.eggs/|
    \*.egg-info/|
    data/.*|
    resources/.*|
    \*.log|
    logs/.*|
    \*_backup\.py|
    \*\.bak|
    \*.exe|
    \*.dll|
    \*.so|
    \*.pyd|
    \.DS_Store|
    \.vscode/|
    \.idea/
  )

default_stages: [commit, push]
fail_fast: false
minimum_pre_commit_version: "2.20.0"
