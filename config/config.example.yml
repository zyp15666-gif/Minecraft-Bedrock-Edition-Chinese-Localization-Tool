# Minecraft 基岩版汉化工具 - 示例配置文件
# 重要：请勿将真实API密钥提交到公开仓库！
# 复制此文件为 config.yml 并填入真实API密钥
#
# 安全说明：
# - API 密钥会使用 Windows DPAPI 加密存储
# - 加密后的密钥只能由当前 Windows 用户账户解密
# - 配置文件中显示为 <SECURE:provider_name> 表示密钥已安全存储
# - 配置版本：2.1（支持自动迁移）

basic:
  indent: 4
  max_retries: 2
  max_workers: 3
  namespace: sgs_farm
  use_multithreading: true
  batch_size: 100  # 分批处理大小
  max_threads_per_api: 5  # 每个API最大并发线程数
  cache_max_size: 2000  # 翻译缓存最大容量
  update_interval: 0.3  # 进度更新间隔（秒）
  update_batch_size: 10  # 批量更新大小
  ast_cache_maxsize: 128  # AST解析缓存大小
  base_delay: 1.0  # 基础重试延迟（秒）
  log_level: INFO  # 日志级别：DEBUG, INFO, WARNING, ERROR
  local_model_use_prompt: true  # 本地模型是否使用提示词
  use_multi_api_validation: false  # 是否启用多重API验证（消耗更多Token）
  local_first_fallback: true  # 本地优先 + 质量降级（本地模型质量差时自动切换云端）
  # 性能预设：填写后会在启动加载配置时覆盖 max_workers / batch_size / max_threads_per_api / update_batch_size
  # 可选空字符串（不应用）、small、balanced、large
  performance_preset: ""

# DeepSeek API配置
deepseek:
- api_key: YOUR_DEEPSEEK_API_KEY_HERE
  api_url: https://api.deepseek.com/v1
  enabled: false
  model: deepseek-chat
  name: DeepSeek_Chat_1
  priority: 1

