  language: zh_CN
  window_size:
  - 800
  - 600
  startup_animation_duration: 0.8
  function_buttons:              # 功能按钮配置（隐藏/排序）
    - id: extract_only
      label: "[1] 仅提取汉化key"
      icon: CONTENT_COPY
      enabled: true
      order: 1
    - id: extract_and_translate
      label: "[2] 提取+AI翻译"
      icon: LANGUAGE
      enabled: true
      order: 2
    - id: replace_display_names
      label: "[3] 全BP替换display_name"
      icon: SYNC
      enabled: true
      order: 3
    - id: batch_delete_value
      label: "[4] 批量删除value"
      icon: DELETE
      enabled: true
      order: 4
    - id: batch_restore_value
      label: "[5] 批量还原value"
      icon: RECYCLING
      enabled: true
      order: 5
    - id: translate_lang_file
      label: "[6] 翻译独立的.lang文件"
      icon: DESCRIPTION
      enabled: true
      order: 6
    - id: one_click_service
      label: "[7] 一条龙服务"
      icon: ROCKET_LAUNCH
      enabled: true
      order: 7
    - id: adapt_entity_display_names
      label: "[8] 高亮实体信息显示名称"
      icon: STAR
      enabled: true
      order: 8
    - id: translate_single_js_file
      label: "[9] 翻译单个JS文件"
