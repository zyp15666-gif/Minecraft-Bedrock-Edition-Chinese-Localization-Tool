# 智谱AI API配置（示例，请替换为真实密钥）
zhipu:
- api_key: YOUR_API_KEY_HERE
  api_url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  enabled: false
  model: GLM-4-Flash
  name: GLM_4_Flash_1

# 高级配置
advanced:
  terminology:
    use_automaton: true          # 启用Aho-Corasick自动机加速术语匹配
  translation:
    dynamic_batch_enabled: true  # 启用自适应分批
    batch_min_chars: 200         # 单批次最小字符数
    batch_max_chars: 600         # 单批次最大字符数
    skip_stage2_complexity_threshold: 0.6  # 复杂度低于此值跳过阶段2
  quality:
    length_min_ratio: 0.15       # 翻译长度最小比例
    length_max_ratio: 3.0        # 翻译长度最大比例
    english_max_ratio: 0.3       # 翻译结果最大英文比例
  complexity:
    color_density_threshold: 0.3
    term_density_threshold: 0.5
    special_chars_threshold: 5
  retry:
    max_retries: 3               # API请求最大重试次数
    base_delay: 1.0               # 基础重试延迟（秒）
    max_delay: 10.0              # 最大重试延迟（秒）
    backoff_factor: 2.0          # 指数退避因子
  prompts_override: ''            # 自定义提示词YAML路径（留空使用内置）
