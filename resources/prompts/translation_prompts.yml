    2. 原文中的所有Minecraft颜色/格式代码（如§a、§o、§r、§0-9）必须原样保留，一个都不能少。
    3. 原文中的换行符(\n)、制表符(\t)和占位符（%1、%s、%d）必须原样保留。
    4. 同一英文短语在全文中的翻译必须保持一致。
    5. 翻译风格简洁自然，符合Minecraft官方简体中文语言习惯。
    6. 若文本为语言键（含冒号和下划线，如 item.stone.name），直接原样返回。

